<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assistente</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111b21;color:#e9edef;font:14px system-ui}header{height:58px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid #2a3942;background:#202c33}header button{margin-left:auto}.content{padding:14px;display:grid;gap:12px}label{display:grid;gap:5px;color:#aebac1;font-size:12px}input,textarea,select{width:100%;border:1px solid #3b4a54;border-radius:8px;background:#202c33;color:#e9edef;padding:9px;font:inherit}textarea{resize:vertical;min-height:74px}.draft{min-height:160px}.row,.shortcuts{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.shortcuts button{font-size:11px;padding:7px}button{border:0;border-radius:8px;padding:9px 11px;background:#00a884;color:white;font-weight:650;cursor:pointer}button.secondary{background:#2a3942;color:#e9edef}button.danger{background:#713b3b}button.icon{flex:0;background:transparent;color:#aebac1;font-size:20px}button:disabled{opacity:.55}.status,.conversation{min-height:18px;color:#aebac1;font-size:12px}.warning{padding:9px;border-radius:8px;background:#332b16;color:#ffd279;font-size:12px}details{border-top:1px solid #2a3942;padding-top:10px}details>div{display:grid;gap:9px;margin-top:10px}.check{display:flex;gap:7px;align-items:center}.check input{width:auto}.profile-card{border:1px solid #2a3942;border-radius:8px;padding:8px;display:grid;gap:7px}</style><style>body.theme-dark{background:#1c1c1c;color:#f2f2f2}body.theme-dark header{background:#2b2b2b;border-bottom-color:#444}body.theme-dark label,body.theme-dark .status,body.theme-dark .conversation{color:#a3a3a3}body.theme-dark input,body.theme-dark textarea,body.theme-dark select{background:#2b2b2b;color:#f2f2f2;border-color:#444}body.theme-dark button.secondary{background:#3a3a3a;color:#f2f2f2}body.theme-dark button.icon{color:#a3a3a3}body.theme-dark details{border-top-color:#444}body.theme-dark .profile-card{border-color:#444}body.theme-dark .warning{background:#3a3216}</style></head><body><header><strong>Assistente contextual</strong><button id="close" class="icon">×</button></header><main class="content"><div class="warning">Lê mensagens visíveis do WhatsApp e apenas insere rascunho; o envio é manual.</div><div id="conversation" class="conversation">Conversa ainda não capturada.</div><label>Perfil de agente<select id="profile"></select></label><div class="shortcuts"><button data-prompt="Resuma a conversa em tópicos.">Resumir</button><button data-prompt="Liste tarefas, responsáveis e prazos mencionados.">Tarefas</button><button data-prompt="Sugira uma resposta curta e objetiva.">Resposta curta</button><button data-prompt="Revise a resposta e confirme somente fatos sustentados pela conversa; sinalize incertezas.">Confirmar fatos</button></div><label>Instrução<textarea id="instruction" placeholder="O que você quer responder?"></textarea></label><button id="generate">Ler conversa e sugerir</button><label>Rascunho<textarea id="draft" class="draft"></textarea></label><div class="row"><button id="insert">Inserir no WhatsApp</button><button id="copy" class="secondary">Copiar</button></div><div id="status" class="status" role="status"></div><details><summary>Perfis de agente</summary><div><div id="profiles"></div><button id="add-profile" class="secondary">Adicionar perfil</button><label>Perfil padrão<select id="default-profile"></select></label><button id="save-profiles" class="secondary">Salvar perfis</button></div></details><details><summary>Gateway global</summary><div><label>Nome<input id="gateway-name"></label><label>URL base<input id="base-url"></label><label>Modo<select id="api-mode"><option value="responses">Responses API</option><option value="chat-completions">Chat Completions</option></select></label><label>Modelo<input id="model"></label><label>Chave<input id="key" type="password" autocomplete="off"></label><label>Headers extras (JSON)<textarea id="headers" placeholder='{"X-Organization":"..."}'></textarea></label><label class="check"><input id="web-capable" type="checkbox"> Gateway suporta pesquisa web</label><label class="check"><input id="web" type="checkbox"> Usar pesquisa web nesta solicitação</label><div class="row"><button id="save" class="secondary">Salvar gateway</button><button id="test" class="secondary">Testar conexão</button></div></div></details></main><script src="assistant.js"></script></body></html>
