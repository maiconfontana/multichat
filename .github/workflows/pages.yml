name: Deploy da página pública

# Publica docs/ no GitHub Pages. A página é estática e consulta a API de
# releases do próprio repositório em tempo de execução, então cada release
# nova aparece sem precisar republicar o site.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar no GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Empacotar docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
