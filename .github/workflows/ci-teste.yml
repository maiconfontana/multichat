name: CI Teste

on:
  pull_request:
  push:
    branches: [teste-alteracao]

jobs:
  teste-que-falha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Passo que passa
        run: echo "CI de teste iniciado"
      - name: Passo que falha de proposito
        run: |
          echo "Forçando falha no CI de teste..."
          exit 1
