name: Build and Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'npm'

      - name: Install Deps
        run: npm ci

      - name: Run Pack
        run: |
          npm run clean
          npm run pack

      - name: Build Linux
        run: |
          npm run dist:linux -- --publish=never

      - name: Build Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npm run dist:windows -- --publish=never

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts
          path: |
            dist/MultiChat-*.tar.xz
            dist/MultiChat-*.AppImage
            dist/MultiChat-*-win.zip
            dist/MultiChat-*-setup.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MultiChat-*.tar.xz
            dist/MultiChat-*.AppImage
            dist/MultiChat-*-win.zip
            dist/MultiChat-*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: 'npm'

      - name: Install Deps
        run: npm ci

      - name: Build macOS (x64 + arm64)
        run: |
          npm run dist:mac -- --publish=never

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifacts-macos
          path: |
            dist/MultiChat-*.dmg
            dist/MultiChat-*-mac*.zip

      - name: Add macOS artifacts to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MultiChat-*.dmg
            dist/MultiChat-*-mac*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
